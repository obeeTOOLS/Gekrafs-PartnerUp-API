<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Splash Gradient -->
    <linearGradient id="splashGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00a8e8"/>
      <stop offset="60%" stop-color="#0082c8"/>
      <stop offset="100%" stop-color="#0066b2"/>
    </linearGradient>

    <!-- Batu Green-Cyan Gradient -->
    <linearGradient id="batuGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c90e"/>
      <stop offset="45%" stop-color="#6bb821"/>
      <stop offset="100%" stop-color="#009fe3"/>
    </linearGradient>

    <!-- Batu Blue Gradient -->
    <linearGradient id="batuBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3e8"/>
      <stop offset="50%" stop-color="#0084c7"/>
      <stop offset="100%" stop-color="#005ea6"/>
    </linearGradient>

    <!-- Yellow Droplet Gradient -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Yellow Droplets / Accents -->
    <circle cx="160" cy="80" r="16" fill="url(#yellowGrad)" />
    <circle cx="370" cy="180" r="15" fill="url(#yellowGrad)" />
    <circle cx="140" cy="315" r="13" fill="url(#yellowGrad)" />
    <circle cx="340" cy="335" r="10" fill="url(#yellowGrad)" />

    <!-- Blue Splash Rounded Droplets -->
    <!-- Top right fingers -->
    <circle cx="340" cy="95" r="11" fill="url(#splashGrad)" />
    <circle cx="375" cy="120" r="11" fill="url(#splashGrad)" />
    <circle cx="400" cy="155" r="10" fill="url(#splashGrad)" />

    <!-- Left fingers -->
    <circle cx="105" cy="225" r="12" fill="url(#splashGrad)" />
    <circle cx="120" cy="270" r="10" fill="url(#splashGrad)" />
    <circle cx="110" cy="175" r="13" fill="url(#splashGrad)" />

    <!-- Bottom fingers -->
    <circle cx="195" cy="340" r="11" fill="url(#splashGrad)" />
    <circle cx="235" cy="355" r="12" fill="url(#splashGrad)" />
    <circle cx="280" cy="355" r="11" fill="url(#splashGrad)" />
    <circle cx="335" cy="300" r="13" fill="url(#splashGrad)" />

    <!-- Main Splash Base (Dynamic fluid polygon with round corners) -->
    <path d="
      M 190 75
      C 220 65, 270 70, 305 85
      C 340 100, 385 130, 395 170
      C 405 210, 385 245, 370 270
      C 355 295, 330 325, 290 335
      C 250 345, 210 335, 175 315
      C 140 295, 115 260, 110 220
      C 105 180, 130 140, 155 110
      Z
    " fill="url(#splashGrad)" />

    <!-- Splash finger strokes radiating outward -->
    <g stroke="url(#splashGrad)" stroke-linecap="round">
      <!-- Top / Right fingers -->
      <line x1="285" y1="90" x2="305" y2="70" stroke-width="22" />
      <line x1="315" y1="105" x2="340" y2="85" stroke-width="20" />
      <line x1="345" y1="125" x2="375" y2="105" stroke-width="19" />
      <line x1="365" y1="150" x2="395" y2="135" stroke-width="18" />
      <line x1="375" y1="180" x2="405" y2="175" stroke-width="18" />
      <line x1="360" y1="215" x2="390" y2="225" stroke-width="19" />
      <line x1="340" y1="245" x2="368" y2="265" stroke-width="18" />

      <!-- Bottom / Left fingers -->
      <line x1="165" y1="125" x2="135" y2="105" stroke-width="22" />
      <line x1="140" y1="155" x2="110" y2="140" stroke-width="20" />
      <line x1="125" y1="190" x2="95" y2="185" stroke-width="20" />
      <line x1="120" y1="225" x2="95" y2="235" stroke-width="20" />
      <line x1="135" y1="260" x2="115" y2="280" stroke-width="19" />
      <line x1="160" y1="290" x2="140" y2="315" stroke-width="18" />
      <line x1="195" y1="310" x2="180" y2="335" stroke-width="18" />
      <line x1="235" y1="320" x2="230" y2="350" stroke-width="19" />
      <line x1="270" y1="315" x2="275" y2="345" stroke-width="18" />
    </g>

    <!-- Bold Typography: GE KRA FS -->
    <g fill="#ffffff" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" letter-spacing="-1">
      <text x="180" y="152" font-size="54">GE</text>
      <text x="180" y="214" font-size="56">KRA</text>
      <text x="180" y="278" font-size="56">FS</text>
    </g>

    <!-- Yellow Subtitle: GERAKAN EKONOMI KREATIF NASIONAL -->
    <g fill="#ffe600" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="0.5">
      <text x="268" y="222">GERAKAN</text>
      <text x="268" y="240">EKONOMI</text>
      <text x="268" y="258">KREATIF</text>
      <text x="268" y="276">NASIONAL</text>
    </g>

    <!-- Bottom Section: Kota BATU -->
    <!-- "Kota" Script + Line -->
    <g transform="translate(150, 365)">
      <text x="0" y="25" fill="#0082c8" font-family="'Plus Jakarta Sans', 'Trebuchet MS', sans-serif" font-weight="800" font-style="italic" font-size="28">Kota</text>
      <line x1="68" y1="20" x2="185" y2="20" stroke="#009fe3" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="194" cy="20" r="2" fill="#009fe3" />
      <circle cx="202" cy="20" r="2" fill="#009fe3" />
    </g>

    <!-- "BATU" Stylized Modern 3D Fold Letters -->
    <g transform="translate(148, 435)" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="70" letter-spacing="2">
      <!-- B with Green Gradient -->
      <text x="0" y="0" fill="url(#batuGreenGrad)">B</text>
      <!-- A with Green-Blue Ribbon Effect -->
      <text x="50" y="0" fill="url(#batuBlueGrad)">A</text>
      <!-- T with Cyan Gradient -->
      <text x="110" y="0" fill="url(#batuGreenGrad)">T</text>
      <!-- U with Cyan-Blue Gradient -->
      <text x="156" y="0" fill="url(#batuBlueGrad)">U</text>
    </g>
  </g>
</svg>
