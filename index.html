<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#001c3c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PartnerUp" />
    <title>Gekrafs PartnerUp Kota Batu</title>
    <meta name="description" content="Modern Web App Headless Google Apps Script & Google Sheets untuk Kurasi, Monitoring, dan Asesmen Mandiri UMKM Kreatif Kota Batu" />
    <meta property="og:title" content="Gekrafs PartnerUp" />
    <meta property="og:description" content="Modern Web App Headless Google Apps Script & Google Sheets untuk Kurasi, Monitoring, dan Asesmen Mandiri UMKM Kreatif Kota Batu" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f0f4f9] text-[#10233d] font-sans antialiased selection:bg-[#004c80] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Watchdog pengaman jika bundle terhalang cache lama
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = `
            <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4f9; color: #001c3c;">
              <div style="max-width: 440px; background: white; border-radius: 20px; padding: 28px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #e2e8f0;">
                <div style="width: 50px; height: 50px; border-radius: 12px; background: #fef3c7; color: #d97706; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 24px;">⚠️</div>
                <h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 800;">Aplikasi Sedang Menyinkronkan</h2>
                <p style="font-size: 13px; color: #64748b; margin: 0 0 20px; line-height: 1.5;">Browser Anda mungkin masih menyimpan cache versi lama. Silakan klik tombol di bawah untuk menyegarkan tampilan.</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                  <button onclick="window.location.reload(true)" style="background: #001c3c; color: white; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; font-size: 13px; cursor: pointer;">Segarkan Halaman</button>
                  <button onclick="localStorage.clear(); if('caches' in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));} if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));} window.location.reload(true);" style="background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 13px; cursor: pointer;">Bersihkan Cache</button>
                </div>
              </div>
            </div>
          `;
        }
      }, 5000);

      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
